<!DOCTYPE html>
<html>
<head>
    <title>Test Door ID</title>
</head>
<body>
    <h1>Testing Door ID Functionality</h1>
    <div id="status">Loading...</div>
    <script>
        // Simulate the door ID functionality from main page
        function getDeviceId() {
            let deviceId = localStorage.getItem('deviceId');
            if (!deviceId) {
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('deviceId', deviceId);
            }
            return deviceId;
        }

        function setDoorIdParam(doorId) {
            const deviceId = getDeviceId();
            if (!doorId) {
                console.log('[DOOR] No door id provided');
                return;
            }
            console.log(`[DOOR] Setting door ID for device ${deviceId} to: ${doorId}`);
            
            fetch('http://127.0.0.1:8001/update_door_id', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Device-ID': deviceId
                },
                body: JSON.stringify({ door_id: doorId, device_id: deviceId })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('status').innerHTML = `✅ Door set: ${doorId}<br>Device: ${deviceId}`;
                    document.getElementById('status').style.color = 'green';
                } else {
                    document.getElementById('status').innerHTML = `❌ Failed: ${data.error}`;
                    document.getElementById('status').style.color = 'red';
                }
            })
            .catch(err => {
                document.getElementById('status').innerHTML = `❌ Error: ${err}`;
                document.getElementById('status').style.color = 'red';
            });
        }

        // Handle door ID from URL parameters
        const params = new URLSearchParams(window.location.search);
        const paramDoorId = params.get('doorid') || params.get('door_id') || params.get('door');
        if (paramDoorId) {
            localStorage.setItem('doorId', paramDoorId);
            setDoorIdParam(paramDoorId);
        } else {
            document.getElementById('status').innerHTML = 'No door ID in URL. Try: ?doorid=19456';
        }
    </script>
</body>
</html>
